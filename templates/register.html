<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <style>

        body{
            font-family: Arial;
            background-color: #e8f5e9;
            text-align: center;
            padding-top: 50px;
        }

        .container{
            width: 320px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1{
            color: green;
        }

        input{
            width: 90%;
            padding: 8px;
            margin: 8px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button{
            background-color: green;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkgreen;
        }

        a{
            text-decoration: none;
            color: blue;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <form method="post">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required><br>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required><br><br>

            <button type="submit">Register</button>

        </form>

        <br>

        <a href="/login">Already have an account? Login</a>

    </div>

</body>

</html>
